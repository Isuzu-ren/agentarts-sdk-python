[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarts-memory-agent"
version = "0.1.0"
description = "AgentArts Memory adapter for Claude Code / Codex / OpenCode"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
cloud = ["agentarts-sdk>=0.1.0"]
dev = ["pytest>=7", "pytest-mock>=3", "httpx>=0.27", "black", "isort", "ruff", "mypy"]

[project.scripts]
agentarts-memory-server = "server.run:main"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100
target-version = "py310"
