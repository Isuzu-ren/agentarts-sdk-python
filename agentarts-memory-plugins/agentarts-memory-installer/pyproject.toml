[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarts-memory-installer"
version = "1.0.0"
description = "Unified installer for AgentArts Memory plugins (hermes, claude, codex, opencode, openclaw)"
requires-python = ">=3.10"
license = "Apache-2.0"

[project.scripts]
agentarts-memory = "agentarts_memory_installer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentarts_memory_installer"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
